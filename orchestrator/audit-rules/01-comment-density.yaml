# Rule 01 — Comment density.
# Axiom: Q3 + Comment Charter density target (1 comment per 30 LOC averaged).
# Class: CANONICAL. Edit only via Governor proposal.

id: 01-comment-density
name: Comment density
axiom_refs: [Q3]
severity: WARNING
handler: comment-density
enabled: true

config:
  scan_repos: true
  extensions: ['.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs']
  max_ratio: 0.1
  min_lines: 30
